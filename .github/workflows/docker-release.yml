name: Docker release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published Release tag to rebuild (v0.1.0)
        required: true
        type: string
permissions:
  contents: read
# Serialize releases, including alias decisions, so late old builds cannot roll aliases back.
concurrency:
  group: pageweave-docker-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.info.outputs.tag }}
      version: ${{ steps.info.outputs.version }}
      sha: ${{ steps.info.outputs.sha }}
      ghcr: ${{ steps.info.outputs.ghcr }}
      hub: ${{ steps.info.outputs.hub }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.1'
      - id: info
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > release.json
          test "$(jq -r '.draft' release.json)" = false
          version=$(tr -d '\n\r' < internal/buildinfo/VERSION)
          sha=$(git rev-parse HEAD)
          test "$RELEASE_TAG" = "v$version"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          go run -mod=readonly ./cmd/releaseplan "$RELEASE_TAG" "$version" "$sha" "$(jq -r .prerelease release.json)" releases.json
          ghcr="ghcr.io/${GITHUB_REPOSITORY,,}"
          hub=""
          if [ -n "$HUB_USER" ] && [ -n "$HUB_TOKEN" ]; then
            hub="${HUB_USER,,}/${GITHUB_REPOSITORY##*/}"
            hub="${hub,,}"
          else
            echo 'Docker Hub credentials absent; publishing GHCR only.' >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "tag=$RELEASE_TAG"
            echo "version=$version"
            echo "sha=$sha"
            echo "ghcr=$ghcr"
            echo "hub=$hub"
          } >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/metadata-action@v6.2.0
        id: metadata
        with:
          images: ${{ needs.prepare.outputs.ghcr }}
          tags: type=raw,value=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
      - name: Build native test image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: browser-test
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: pageweave:browser-test
          build-args: COMMIT=${{ needs.prepare.outputs.sha }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
      - name: Real Chromium tests
        run: docker run --rm --init --shm-size=256m --security-opt seccomp=deploy/chromium-seccomp.json pageweave:browser-test
      - name: Build native administration test image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: admin-test
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: pageweave:admin-test
          build-args: COMMIT=${{ needs.prepare.outputs.sha }}
      - name: Administration browser tests
        run: docker run --rm --init --shm-size=256m --security-opt seccomp=deploy/chromium-seccomp.json pageweave:admin-test
      - name: Build native service image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: pageweave:local
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: COMMIT=${{ needs.prepare.outputs.sha }}
      - name: Verify runtime and record versions
        run: |
          bash scripts/container-smoke.sh pageweave:local
          docker run --rm pageweave:local --version >> "$GITHUB_STEP_SUMMARY"
          docker run --rm --entrypoint chromium pageweave:local --version >> "$GITHUB_STEP_SUMMARY"
          echo 'Builder: Go 1.27.1; native platform: linux/${{ matrix.arch }}' >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/login-action@v4.6.0
        if: needs.prepare.outputs.hub != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image destinations
        id: destinations
        env:
          GHCR: ${{ needs.prepare.outputs.ghcr }}
          HUB: ${{ needs.prepare.outputs.hub }}
        run: |
          names="$GHCR"
          if [ -n "$HUB" ]; then names="$names,$HUB"; fi
          echo "names=$names" >> "$GITHUB_OUTPUT"
      - name: Push validated build by digest
        uses: docker/build-push-action@v7.4.0
        id: push
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: COMMIT=${{ needs.prepare.outputs.sha }}
          outputs: type=image,"name=${{ steps.destinations.outputs.names }}",push-by-digest=true,name-canonical=true,push=true
          provenance: false
      - name: Save digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1
  manifest:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      GHCR: ${{ needs.prepare.outputs.ghcr }}
      HUB: ${{ needs.prepare.outputs.hub }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.1'
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/login-action@v4.6.0
        if: needs.prepare.outputs.hub != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish complete manifests and guarded aliases
        shell: bash
        run: |
          set -euo pipefail
          test -s digests/amd64 && test -s digests/arm64
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > release.json
          test "$(jq -r .draft release.json)" = false
          go run -mod=readonly ./cmd/releaseplan "$RELEASE_TAG" "$VERSION" "$RELEASE_SHA" "$(jq -r .prerelease release.json)" releases.json > tags.txt
          for repository in "$GHCR" "$HUB"; do
            [ -n "$repository" ] || continue
            amd="$repository@$(cat digests/amd64)"
            arm="$repository@$(cat digests/arm64)"
            # Create and inspect the exact version before updating floating aliases.
            docker buildx imagetools create -t "$repository:$VERSION" "$amd" "$arm"
            docker buildx imagetools inspect "$repository:$VERSION" --raw > manifest.json
            jq -e '[.manifests[].platform | select(.os=="linux") | .architecture] | sort == ["amd64","arm64"]' manifest.json
            while IFS= read -r tag; do
              [ "$tag" != "$VERSION" ] || continue
              docker buildx imagetools create -t "$repository:$tag" "$repository:$VERSION"
            done < tags.txt
          done
      - name: Publish deployment files
        run: gh release upload "$RELEASE_TAG" compose.yaml deploy/chromium-seccomp.json .env.example --clobber
